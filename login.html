<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Вхід до каталогу</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="login-page">
    <header class="topbar">
      <a class="brand" href="login.html" aria-label="Вхід до каталогу">
        <span class="brand-mark">T</span>
        <span>
          <strong>TyreStock</strong>
          <small>оптовий каталог</small>
        </span>
      </a>
    </header>

    <main class="login-main">
      <section class="login-screen" aria-label="Вхід до каталогу">
        <form class="login-card" id="loginForm">
          <div>
            <p class="eyebrow">Доступ для оптових клієнтів</p>
            <h1>Вхід до каталогу</h1>
            <p>Введіть номер телефону та PIN-код з 4 цифр.</p>
          </div>

          <label>
            <span>Телефон</span>
            <input id="loginPhone" type="tel" placeholder="+380..." autocomplete="tel" required />
          </label>

          <label>
            <span>PIN</span>
            <input id="loginPin" type="password" inputmode="numeric" maxlength="4" placeholder="1234" autocomplete="one-time-code" required />
          </label>

          <button class="login-button" type="submit">Увійти</button>
          <p class="login-error" id="loginError" hidden>Телефон або PIN не знайдено.</p>
        </form>
      </section>
    </main>

    <script src="auth.js"></script>
    <script src="login.js"></script>
  </body>
</html>
